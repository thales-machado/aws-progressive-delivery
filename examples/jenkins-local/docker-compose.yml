services:
  jenkins:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../..:/opt/repo:ro
      - ${HOME}/.aws:/var/jenkins_home/.aws:ro

volumes:
  jenkins_home:
